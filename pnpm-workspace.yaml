packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  less: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true

# pnpm 11 default: block packages newer than 24h (supply-chain cooldown)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - electron-to-chromium
